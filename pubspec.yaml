name: trimbakeshwar_app
description: Trimbakeshwar Jyotirlinga Temple App
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.1
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^6.2.1
  razorpay_flutter: ^1.3.6
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.4.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/sounds/
    - assets/legal/

  fonts:
    - family: Samarkan
      fonts:
        - asset: assets/fonts/samarkan.ttf
